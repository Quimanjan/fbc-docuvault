<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>FBC DocuVault</title>
<meta name="description" content="Fellowship Baptist College student papers and graduation requirements tracker.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Zilla+Slab:wght@500;600;700&family=Public+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: registrar's filing cabinet. A maroon masthead with gold rule, then manila-folder cards with tabs,
   one per paper; registrar view is a ledger table with a detail drawer. */
:root{
  --bg:#f6f1f0; --surface:#fffcfb; --folder:#f2e3c4; --folder-edge:#d8c193;
  --ink:#2a1a1d; --muted:#6e5c60; --line:#e8dcda;
  --brand:#7a1c2a; --brand-ink:#ffffff; --brand-soft:#f3e1e3; --gold:#c4952b;
  --ok:#1f7a4d; --ok-bg:#e1f2e8; --warn:#9a6400; --warn-bg:#fbefd2;
  --bad:#b0322a; --bad-bg:#f9e2df; --none:#6c7280; --none-bg:#ecebe7;
  --focus:#b03049;
  --f-display:"Zilla Slab", Georgia, serif;
  --f-body:"Public Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
  --f-mono:"IBM Plex Mono", ui-monospace, Menlo, monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#171113; --surface:#21181b; --folder:#3a2f22; --folder-edge:#5a4a30;
  --ink:#efe6e7; --muted:#b4a3a6; --line:#3a2c30;
  --brand:#8e2636; --brand-ink:#fff6f6; --brand-soft:#3a1d23; --gold:#e0b552;
  --ok:#6fd19f; --ok-bg:#16352a; --warn:#f0c062; --warn-bg:#3a2f15;
  --bad:#f08a80; --bad-bg:#3f1f1d; --none:#a0a6b1; --none-bg:#262c35;
  --focus:#ff9aa9; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#171113; --surface:#21181b; --folder:#3a2f22; --folder-edge:#5a4a30;
  --ink:#efe6e7; --muted:#b4a3a6; --line:#3a2c30;
  --brand:#8e2636; --brand-ink:#fff6f6; --brand-soft:#3a1d23; --gold:#e0b552;
  --ok:#6fd19f; --ok-bg:#16352a; --warn:#f0c062; --warn-bg:#3a2f15;
  --bad:#f08a80; --bad-bg:#3f1f1d; --none:#a0a6b1; --none-bg:#262c35;
  --focus:#ff9aa9; color-scheme:dark}

*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.5}
h1,h2,h3{font-family:var(--f-display);text-wrap:balance;margin:0;line-height:1.15}
button,input,select{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--focus);outline-offset:2px}
.wrap{max-width:1080px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums}

/* masthead */
.mast{background:var(--brand);color:var(--brand-ink);border-bottom:4px solid var(--gold)}
.mast .wrap{display:flex;align-items:center;gap:14px;padding-block:16px;flex-wrap:wrap}
.crest{width:46px;height:46px;border-radius:50%;border:2px solid var(--gold);display:grid;place-items:center;font-family:var(--f-display);font-weight:700;color:var(--gold);flex:none}
.mast h1{font-size:1.45rem;font-weight:700}
.mast p{margin:0;font-size:.82rem;opacity:.8}
.mast .who{margin-left:auto;font-size:.8rem;display:flex;gap:8px;align-items:center}
.chip{display:inline-block;padding:2px 9px;border-radius:999px;border:1px solid currentColor;font-size:.72rem;letter-spacing:.06em;text-transform:uppercase;font-weight:600}
.tabs{display:flex;gap:4px;margin-top:-1px}
.tabs .wrap{display:flex;gap:4px;padding-block:0}
.tab{background:none;border:0;padding:12px 16px;font-weight:600;color:var(--muted);border-bottom:3px solid transparent;cursor:pointer}
.tab[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--gold)}
.bar{border-bottom:1px solid var(--line);background:var(--surface)}

main{padding-block:24px 64px}
.banner{background:var(--warn-bg);color:var(--warn);border-radius:8px;padding:10px 14px;font-size:.88rem;margin-bottom:18px}

/* buttons & fields */
.btn{display:inline-flex;align-items:center;gap:6px;border-radius:7px;padding:8px 14px;border:1px solid var(--line);background:var(--surface);cursor:pointer;font-weight:600;font-size:.88rem;white-space:nowrap}
.btn:hover{border-color:var(--muted)}
.btn.primary{background:var(--brand);color:var(--brand-ink);border-color:var(--brand)}
.btn.ok{background:var(--ok-bg);color:var(--ok);border-color:transparent}
.btn.bad{background:var(--bad-bg);color:var(--bad);border-color:transparent}
.btn.ghost{background:none;border-color:transparent;color:var(--muted)}
.btn:disabled{opacity:.5;cursor:default}
label.f{display:grid;gap:4px;font-size:.78rem;font-weight:600;color:var(--muted);letter-spacing:.03em}
input[type=text],select{width:100%;padding:9px 11px;border:1px solid var(--line);border-radius:7px;background:var(--surface);font-size:.95rem;color:var(--ink)}
.file-in{position:absolute;width:1px;height:1px;opacity:0;pointer-events:none}

/* status pill */
.pill{display:inline-flex;align-items:center;gap:6px;padding:3px 10px;border-radius:999px;font-size:.74rem;font-weight:700;letter-spacing:.04em;text-transform:uppercase}
.pill::before{content:"";width:7px;height:7px;border-radius:50%;background:currentColor}
.s-verified{color:var(--ok);background:var(--ok-bg)}
.s-submitted{color:var(--warn);background:var(--warn-bg)}
.s-returned{color:var(--bad);background:var(--bad-bg)}
.s-missing{color:var(--none);background:var(--none-bg)}

/* student summary */
.me-head{display:flex;gap:20px;align-items:flex-end;justify-content:space-between;flex-wrap:wrap;margin-bottom:22px}
.me-head h2{font-size:1.9rem}
.me-head .meta{color:var(--muted);font-size:.9rem}
.meter{min-width:240px;flex:1;max-width:360px}
.meter .lbl{display:flex;justify-content:space-between;font-size:.82rem;color:var(--muted);margin-bottom:6px}
.meter .lbl b{color:var(--ink);font-size:1rem}
.track{display:grid;grid-template-columns:repeat(4,1fr);gap:4px}
.track span{height:8px;border-radius:3px;background:var(--none-bg)}
.track span.verified{background:var(--ok)}
.track span.submitted{background:var(--gold)}
.track span.returned{background:var(--bad)}

.sec-title{display:flex;align-items:baseline;justify-content:space-between;gap:12px;margin:30px 0 12px;flex-wrap:wrap}
.sec-title h3{font-size:1.25rem}
.sec-title p{margin:0;color:var(--muted);font-size:.85rem}

/* folder cards */
.folders{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:22px 18px;padding-top:14px}
.folder{position:relative;background:var(--folder);border:1px solid var(--folder-edge);border-radius:0 10px 10px 10px;padding:16px;display:flex;flex-direction:column;gap:12px;min-width:0}
.folder::before{content:attr(data-tab);position:absolute;top:-24px;left:-1px;height:24px;padding:3px 14px 0;background:var(--folder);border:1px solid var(--folder-edge);border-bottom:0;border-radius:8px 8px 0 0;font-family:var(--f-mono);font-size:.72rem;font-weight:500;letter-spacing:.04em;color:var(--muted)}
.folder h4{margin:0;font-family:var(--f-display);font-size:1.15rem}
.folder .desc{margin:0;font-size:.8rem;color:var(--muted)}
.thumb{aspect-ratio:8.5/11;max-width:100%;background:var(--surface);border:1px solid var(--folder-edge);border-radius:4px;overflow:hidden;display:grid;place-items:center;color:var(--muted);font-size:.8rem;text-align:center;cursor:pointer;padding:0}
.thumb img{width:100%;height:100%;object-fit:cover;object-position:top}
.thumb.empty{cursor:default;border-style:dashed;background:transparent;padding:12px}
.note{font-size:.8rem;background:var(--bad-bg);color:var(--bad);padding:7px 9px;border-radius:6px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.fname{font-size:.78rem;color:var(--muted);overflow-wrap:anywhere}
.serial{font-family:var(--f-mono);font-size:1.05rem;letter-spacing:.03em;background:var(--surface);border:1px solid var(--folder-edge);border-radius:6px;padding:8px 10px;overflow-wrap:anywhere}

/* extras list */
.extras{display:grid;gap:10px}
.extra{display:grid;grid-template-columns:56px 1fr auto;gap:14px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:10px 12px}
.extra .mini{width:56px;height:72px;border:1px solid var(--line);border-radius:3px;overflow:hidden;background:var(--bg);display:grid;place-items:center;font-size:.65rem;color:var(--muted);cursor:pointer;padding:0}
.extra .mini img{width:100%;height:100%;object-fit:cover;object-position:top}
.extra b{display:block}
.extra > div{min-width:0}
.add{display:grid;grid-template-columns:1fr auto;gap:10px;align-items:end;background:var(--surface);border:1px dashed var(--folder-edge);border-radius:10px;padding:14px}
.empty-line{color:var(--muted);font-size:.9rem;padding:6px 2px}

/* profile form */
.card{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:22px;max-width:560px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}

/* registrar */
.stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;margin-bottom:20px}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:12px 14px;cursor:pointer;text-align:left}
.stat[aria-pressed="true"]{border-color:var(--brand);box-shadow:inset 0 0 0 1px var(--brand)}
.stat b{display:block;font-family:var(--f-display);font-size:1.9rem;font-variant-numeric:tabular-nums;line-height:1.1}
.stat span{font-size:.78rem;color:var(--muted);text-transform:uppercase;letter-spacing:.05em;font-weight:600}
.tools{display:flex;gap:10px;margin-bottom:12px;flex-wrap:wrap}
.tools input{max-width:340px}
.ledger-wrap{overflow-x:auto;background:var(--surface);border:1px solid var(--line);border-radius:10px}
table{border-collapse:collapse;width:100%;min-width:720px;font-size:.88rem}
th{text-align:left;font-size:.7rem;text-transform:uppercase;letter-spacing:.07em;color:var(--muted);padding:10px 12px;border-bottom:1px solid var(--line);font-weight:600}
td{padding:11px 12px;border-bottom:1px solid var(--line);vertical-align:middle}
tbody tr{cursor:pointer}
tbody tr:hover{background:var(--bg)}
tbody tr:last-child td{border-bottom:0}
.dot{display:inline-block;width:12px;height:12px;border-radius:50%}
.dot.verified{background:var(--ok)} .dot.submitted{background:var(--gold)} .dot.returned{background:var(--bad)} .dot.missing{background:transparent;border:2px solid var(--none)}
td.c,th.c{text-align:center}
.tag{font-size:.65rem;font-weight:700;letter-spacing:.06em;color:var(--muted);border:1px solid var(--line);border-radius:4px;padding:1px 5px;margin-left:6px;vertical-align:2px}
.legend{display:flex;gap:16px;flex-wrap:wrap;font-size:.78rem;color:var(--muted);margin-top:10px}
.legend span{display:inline-flex;gap:6px;align-items:center}

/* drawer + viewer */
.scrim{position:fixed;inset:0;background:rgba(22,10,13,.55);z-index:20}
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(560px,100%);background:var(--bg);z-index:21;overflow-y:auto;
  padding:calc(20px + env(safe-area-inset-top,0px)) max(18px,env(safe-area-inset-right,0px)) calc(28px + env(safe-area-inset-bottom,0px)) 18px;border-left:4px solid var(--gold)}
.drawer h3{font-size:1.5rem}
.d-doc{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:12px;display:grid;grid-template-columns:72px 1fr;gap:12px;margin-top:10px}
.d-doc .mini{width:72px;height:93px;border:1px solid var(--line);border-radius:3px;overflow:hidden;display:grid;place-items:center;font-size:.65rem;color:var(--muted);background:var(--bg);padding:0;cursor:pointer}
.d-doc .mini img{width:100%;height:100%;object-fit:cover;object-position:top}
.d-doc > div{min-width:0;display:grid;gap:6px}
.viewer{position:fixed;inset:0;z-index:30;display:grid;grid-template-rows:auto 1fr;background:rgba(22,10,13,.92);padding:calc(10px + env(safe-area-inset-top,0px)) max(12px,env(safe-area-inset-right,0px)) calc(10px + env(safe-area-inset-bottom,0px)) max(12px,env(safe-area-inset-left,0px))}
.viewer header{display:flex;justify-content:space-between;align-items:center;color:#fff;gap:10px;padding-bottom:8px}
.viewer header .btn{background:#ffffff1a;color:#fff;border-color:#ffffff33}
.viewer .stage{overflow:auto;display:grid;place-items:start center}
.viewer img{max-width:min(900px,100%);height:auto;background:#fff}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(20px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:8px;font-size:.88rem;z-index:40;max-width:calc(100% - 32px)}

/* library */
.uploader{display:grid;grid-template-columns:2fr 1.2fr auto;gap:12px;align-items:end;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:16px}
.uploader .share{grid-column:1/-1;display:flex;gap:8px;align-items:center;font-size:.85rem;color:var(--muted)}
.uploader .share input{width:16px;height:16px;accent-color:var(--brand)}
.filters{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin:20px 0 14px}
.fchip{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:5px 12px;font-size:.82rem;font-weight:600;cursor:pointer;color:var(--muted)}
.fchip[aria-pressed="true"]{background:var(--brand);border-color:var(--brand);color:var(--brand-ink)}
.fchip b{font-variant-numeric:tabular-nums;margin-left:4px;opacity:.8}
.filters input{max-width:260px;margin-left:auto}
.lib{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:16px}
.tile{background:var(--surface);border:1px solid var(--line);border-radius:10px;overflow:hidden;display:flex;flex-direction:column;min-width:0}
.tile .thumb{border:0;border-bottom:1px solid var(--line);border-radius:0;aspect-ratio:4/3}
.tile .body{padding:10px 12px 12px;display:grid;gap:6px;flex:1}
.tile b{font-size:.92rem;line-height:1.3;overflow-wrap:anywhere}
.tile .src{font-size:.68rem;font-weight:700;letter-spacing:.06em;text-transform:uppercase}
.src.req{color:var(--brand)} .src.shared{color:var(--warn)} .src.private{color:var(--muted)}
.tile .foot{display:flex;justify-content:space-between;align-items:center;gap:6px;margin-top:auto;flex-wrap:wrap}
.tile .pill{font-size:.64rem;padding:2px 8px}
.ftype{font-family:var(--f-mono);font-size:.8rem;color:var(--muted)}
.linkbtn{background:none;border:0;padding:0;color:var(--brand);font-weight:600;cursor:pointer;font-size:.85rem;text-decoration:underline;text-underline-offset:3px}

@media (max-width:640px){
  .uploader{grid-template-columns:1fr}
  .filters input{max-width:none;margin-left:0}
  .stats{grid-template-columns:repeat(2,minmax(0,1fr))}
  .grid2{grid-template-columns:1fr}
  .add{grid-template-columns:1fr}
  .mast .who{margin-left:0}
  .extra{grid-template-columns:48px 1fr}
  .extra .acts{grid-column:1/-1}
}
@media (prefers-reduced-motion:no-preference){.drawer{animation:slide .18s ease-out}@keyframes slide{from{transform:translateX(24px);opacity:.6}}}
.mail{font-size:.8rem;opacity:.85;overflow-wrap:anywhere}
.btn.light{color:var(--brand-ink);border-color:#ffffff55}
.btn.light:hover{border-color:#fff}
input[type=email],input[type=password]{width:100%;padding:9px 11px;border:1px solid var(--line);border-radius:7px;background:var(--surface);font-size:.95rem;color:var(--ink)}
.card{margin-inline:auto}
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
body{margin:0;font-size:15px}
img{max-width:100%}
[hidden]{display:none!important}
</style>
</head>
<body>
<header class="mast">
  <div class="wrap">
    <div class="crest" aria-hidden="true">FBC</div>
    <div>
      <h1>FBC DocuVault</h1>
      <p>Student Papers &amp; Requirements · Fellowship Baptist College · Kabankalan City</p>
    </div>
    <div class="who" id="who"></div>
  </div>
</header>
<nav class="bar" id="tabbar" hidden>
  <div class="wrap tabs" role="tablist">
    <button class="tab" role="tab" id="tab-me" aria-selected="true">Requirements</button>
    <button class="tab" role="tab" id="tab-docs" aria-selected="false">My documents</button>
    <button class="tab" role="tab" id="tab-reg" aria-selected="false">Registrar clearance</button>
  </div>
</nav>
<main class="wrap">
  <section id="view-auth"><p class="empty-line">Loading…</p></section>
  <section id="view-me" hidden></section>
  <section id="view-docs" hidden></section>
  <section id="view-reg" hidden></section>
</main>
<div id="overlay"></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.57.4/dist/umd/supabase.js"></script>
<script src="config.js"></script>
<script src="mock.js"></script>
<script src="app.js"></script>
</body>
</html>
